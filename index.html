<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세원이의 한국 철도 역사 대모험!</title>
    <style>
        body {
            background-color: #eef2f7;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 20px;
        }
        .game-card {
            background: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; font-size: 22px; }
        .emoji { font-size: 50px; margin: 10px 0; }
        .question { font-size: 18px; color: #34495e; margin: 20px 0; font-weight: bold; text-align: left; }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }
        .btn:hover { background-color: #2980b9; }
        #result { font-size: 18px; font-weight: bold; margin-top: 20px; color: #e74c3c; }
        #progress { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>🚂 세원이의 한국 철도 역사 척척박사 퀴즈 🚄</h1>
        <div id="progress"></div>
        <div class="emoji" id="emoji">🇰🇷</div>
        <div class="question" id="question">문제가 로딩 중입니다...</div>
        <div id="choices"></div>
        <div id="result"></div>
    </div>

    <script>
        const quizzes = [
            {
                emoji: "🚇",
                question: "1. 대한민국 최초의 지하철인 '서울 지하철 1호선'이 처음 개통된 연도는 언제일까요?",
                choices: ["1) 1950년", "2) 1974년", "3) 1988년", "4) 2002년"],
                answer: 1,
                comment: "정답은 1974년! 서울역부터 청량리까지 지하철이 처음으로 달리기 시작한 해랍니다."
            },
            {
                emoji: "🚂",
                question: "2. 우리나라에 처음으로 증기기관차가 달리기 시작한 경인선 개통 연도는 언제일까요?",
                choices: ["1) 1899년", "2) 1910년", "3) 1945년", "4) 1960년"],
                answer: 0,
                comment: "정답은 1899년! 노량진과 제물포 사이를 칙칙폭폭 증기기관차가 처음 달렸어요."
            },
            {
                emoji: "🛤️",
                question: "3. 추억의 파란색 객차로 많은 사람들의 사랑을 받은 '무궁화호'가 처음 운행을 시작한 연도는?",
                choices: ["1) 1965년", "2) 1977년", "3) 1984년", "4) 1995년"],
                answer: 1,
                comment: "정답은 1977년! 무궁화호가 이 세상에 태어났답니다."
            },
            {
                emoji: "💨",
                question: "4. 초록색과 파란색 띠를 두르고 서민들의 발이 되어주었던 '비둘기호'가 처음 등장한 연도는?",
                choices: ["1) 1954년", "2) 1960년", "3) 1970년", "4) 1982년"],
                answer: 0,
                comment: "정답은 1954년! 가장 느리지만 정겨웠던 비둘기호가 달리기 시작했어요."
            },
            {
                emoji: "🚄",
                question: "5. 대한민국을 반일권으로 바꾼 고속열차 'KTX'가 첫 운행을 시작한 역사적인 연도는?",
                choices: ["1) 1998년", "2) 2001년", "3) 2004년", "4) 2010년"],
                answer: 2,
                comment: "정답은 2004년! 서울에서 부산까지 쌩~ 하고 달리는 KTX가 개통되었어요."
            },
            {
                emoji: "🚅",
                question: "6. 우리나라 기술로 만든 최초의 고속열차 'KTX-산천'이 운행을 시작한 연도는?",
                choices: ["1) 2006년", "2) 2010년", "3) 2015년", "4) 2018년"],
                answer: 1,
                comment: "정답은 2010년! 토종 기술로 만든 멋진 KTX-산천이 등장했어요."
            },
            {
                emoji: "🤝",
                question: "7. 철도 공공성 강화 등을 위해 SR(SRT)과 코레일(KTX)의 통합 논의 및 관련 협력이 이어져 온 상징적인 연대/통합 관련 연도는? (SRT 개통 기준: 2016년)",
                choices: ["1) 2012년", "2) 2014년", "3) 2016년", "4) 2022년"],
                answer: 2,
                comment: "정답은 2016년! 고속철도 수서고속철도(SRT)가 개통되면서 새로운 철도 시대가 열렸지요."
            }
        ];

        let currentIdx = 0;

        function loadQuiz() {
            document.getElementById("progress").innerText = `[ 문제 ${currentIdx + 1} / ${quizzes.length} ]`;
            const q = quizzes[currentIdx];
            document.getElementById("emoji").innerText = q.emoji;
            document.getElementById("question").innerText = q.question;
            document.getElementById("result").innerText = "";
            
            let choiceHtml = "";
            q.choices.forEach((choice, index) => {
                choiceHtml += `<button class="btn" onclick="checkAnswer(${index})">${choice}</button>`;
            });
            document.getElementById("choices").innerHTML = choiceHtml;
        }

        function checkAnswer(selected) {
            const q = quizzes[currentIdx];
            if (selected === q.answer) {
                alert("딩동댕! 🌟 " + q.comment);
                currentIdx++;
                if (currentIdx < quizzes.length) {
                    loadQuiz();
                } else {
                    document.getElementById("progress").innerText = "🎉 퀴즈 완료!";
                    document.getElementById("emoji").innerText = "🏆";
                    document.getElementById("question").innerText = "축하합니다! 세원이는 명예 철도 역사 박사님이에요!";
                    document.getElementById("choices").innerHTML = "";
                    document.getElementById("result").innerText = "멋지게 게임을 클리어했습니다! 친구에게도 공유해 보세요!";
                }
            } else {
                alert("앗, 아쉽워요! 정답이 아니에요. 다시 골라볼까요? 🤔");
            }
        }

        loadQuiz();
    </script>

</body>
</html>
